<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VibeMatch - Music for your mood</title>
  <meta name="description" content="Tell VibeMatch how you feel and get songs that fit.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5efc'/%3E%3Cpath d='M9 20v-8m5 11V9m5 11v-6m5 6v-9' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9 20v-8m5 11V9m5 11v-6m5 6v-9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
      <span class="brand-name">VibeMatch</span>
      <span class="brand-tag">Music for your mood</span>
    </div>
    <button class="chat-toggle" id="chatToggle" aria-controls="chatPanel" aria-expanded="false">Chat</button>
  </header>

  <div class="layout">
    <main class="results" aria-labelledby="resultsTitle">
      <div class="results-head">
        <div>
          <h1 id="resultsTitle">Recommended for you</h1>
          <p class="subtitle" id="subtitle">Tell the assistant how you feel to get started.</p>
        </div>
        <div class="tabs" role="tablist">
          <button role="tab" class="tab active" id="tabForYou" aria-selected="true">For you</button>
          <button role="tab" class="tab" id="tabAll" aria-selected="false">Browse all</button>
        </div>
      </div>

      <div class="toolbar" id="toolbar" hidden>
        <div class="chips" id="genreChips" aria-label="Filter by genre"></div>
        <label class="sort">Sort
          <select id="sortSelect">
            <option value="match">Best match</option>
            <option value="energy-desc">Energy: high to low</option>
            <option value="energy-asc">Energy: low to high</option>
            <option value="title">Title A-Z</option>
          </select>
        </label>
      </div>

      <div id="profile" class="profile" hidden></div>
      <div id="grid" class="grid" aria-live="polite"></div>
    </main>

    <aside class="chat" id="chatPanel" aria-label="Chat assistant">
      <div class="chat-head">
        <div>
          <strong>Mood assistant</strong>
          <span class="status"><i class="dot"></i>Online</span>
        </div>
        <button class="icon-btn chat-close" id="chatClose" aria-label="Close chat">&times;</button>
      </div>
      <div class="messages" id="messages" role="log" aria-live="polite"></div>
      <div class="suggest" id="suggest"></div>
      <form class="composer" id="composer" autocomplete="off">
        <input id="input" type="text" maxlength="500" placeholder="e.g. chill lofi for studying" aria-label="Describe your mood">
        <button type="submit" id="send" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </form>
    </aside>
  </div>

  <div class="toast" id="toast" role="alert" hidden></div>
  <script src="app.js"></script>
</body>
</html>
